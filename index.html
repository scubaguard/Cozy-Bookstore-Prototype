const RARITY_COLORS = { Legendary: "#FFD700", Epic: "#A855F7", Rare: "#3B82F6", Uncommon: "#22C55E" };

function rollRareBook(ownedIds) {
  const available = RARE_BOOKS.filter(b => !ownedIds.includes(b.id));
  if (available.length === 0) return null;
  const roll = Math.random();
  let pool;
  if (roll < 0.02) pool = available.filter(b => b.rarity === "Legendary");
  else if (roll < 0.08) pool = available.filter(b => b.rarity === "Epic");
  else if (roll < 0.25) pool = available.filter(b => b.rarity === "Rare");
  else pool = available.filter(b => b.rarity === "Uncommon");
  if (pool.length === 0) pool = available;
  return pool[Math.floor(Math.random() * pool.length)];
}

function generateRegular(day, existingCount) {
  const seed = day * 37 + existingCount * 13 + 7;
  const gk = Object.keys(GENRES);
  return {
    id: "reg_" + day + "_" + existingCount,
    name: REG_FIRST[seed % REG_FIRST.length],
    favGenre: gk[seed % gk.length],
    trait: REG_TRAITS[seed % REG_TRAITS.length],
    loyalty: 50, lastVisit: day,
    visitFreq: 3 + (seed % 4),
    totalSpent: 0, visits: 0,
    skinIdx: seed % 5, shirtIdx: seed % 10, hairIdx: (seed * 3) % 7,
  };
}

function getStaffCost(staff) {
  let total = 0;
  Object.keys(staff).forEach(k => { total += (staff[k] || 0) * (STAFF_ROLES[k]?.wage || 0); });
  return total;
}

function isMaxLevel(st) {
  const avail = LOCATIONS[st.location]?.layout?.expansions || [];
  return avail.every(k => !!st.expansions[k]);
}

function getStoreSize(st) {
  let custMax = 12, stockMult = 1.0, trafficMult = 1.0, extraRent = 0;
  Object.keys(st.expansions || {}).forEach(k => {
    if (st.expansions[k]) {
      const e = EXPANSIONS[k];
      custMax += e.maxCustBonus; stockMult *= e.stockMult;
      trafficMult *= e.trafficMult; extraRent += e.rentIncrease;
    }
  });
  return { custMax, stockMult, trafficMult, extraRent };
}

function getUpgradeStats(st) {
  let tm = 1, rm = 1, coz = 10;
  Object.keys(st.upgrades).forEach(k => {
    const val = st.upgrades[k]; if (!val) return;
    const u = UPGRADES[k];
    if (k === "cafe" && (st.staff.baristas || 0) === 0) { coz += u.coz; return; }
    const tier = val.tier || 1;
    if (tier === 2 && u.tier2) { tm *= u.tier2.tm; rm *= u.tier2.rm; coz += u.tier2.coz; }
    else { tm *= u.tm; rm *= u.rm; coz += u.coz; }
  });
  Object.keys(st.expansions || {}).forEach(k => { if (st.expansions[k]) coz += EXPANSIONS[k].coziness; });
  return { tm, rm, coz };
}

function getBuyAmounts(st) {
  const { stockMult } = getStoreSize(st);
  if (stockMult >= 1.5) return [10, 25, 50, 100];
  if (stockMult >= 1.3) return [5, 15, 40, 75];
  return [5, 10, 25];
}

function getShelfCapacity(st) {
  const shelfBooks = (st.shelves || 4) * 15;
  const baseStorage = 200 + (st.storageUpgrades || 0) * 100;
  const mult = getStoreSize(st).stockMult;
  return Math.floor((shelfBooks + baseStorage) * mult);
}

function getTotalStock(st) {
  return Object.values(st.inventory).reduce((s, v) => s + v.stock, 0);
}

function getShelfBrowseBonus(st) {
  const loc = LOCATIONS[st.location];
  const minSh = loc.layout.startShelves;
  const maxSh = loc.layout.maxShelves;
  const cur = st.shelves || minSh;
  const pct = Math.max(0, (cur - minSh) / Math.max(1, maxSh - minSh));
  return { buyChanceMod: pct * 0.12, revenueMult: 1 + pct * 0.25 };
}

// The game reducer is very large — I'll include it in full for correctness
function gameReducer(st, a) {
  switch (a.type) {
    case "BUY_BOOKS": {
      const c = GENRES[a.genre].cost * a.qty;
      if (st.cash < c) return st;
      const cap = getShelfCapacity(st);
      const curTotal = getTotalStock(st);
      const canFit = cap - curTotal;
      const qty = Math.min(a.qty, canFit);
      if (qty <= 0) return st;
      const cost = GENRES[a.genre].cost * qty;
      return { ...st, cash: Math.round(st.cash - cost), inventory: { ...st.inventory, [a.genre]: { ...st.inventory[a.genre], stock: st.inventory[a.genre].stock + qty } } };
    }
    case "SET_NAME": return { ...st, storeName: (a.name || "Paper Dreams").slice(0, 30) };
    case "BUY_SHELF": {
      const shelfCost = 400 + (st.shelves || 4) * 200;
      const maxSh = LOCATIONS[st.location]?.layout?.maxShelves || 16;
      if (st.cash < shelfCost || (st.shelves || 4) >= maxSh) return st;
      return { ...st, cash: Math.round(st.cash - shelfCost), shelves: (st.shelves || 4) + 1 };
    }
    case "BUY_STORAGE": {
      const lvl = st.storageUpgrades || 0;
      const storageCost = 800 + lvl * 600;
      if (st.cash < storageCost || lvl >= 5) return st;
      return { ...st, cash: Math.round(st.cash - storageCost), storageUpgrades: lvl + 1 };
    }
    case "SET_PRICE": return { ...st, inventory: { ...st.inventory, [a.genre]: { ...st.inventory[a.genre], price: Math.max(1, a.price) } } };
    case "HIRE": {
      const role = STAFF_ROLES[a.role];
      if (!role) return st;
      if ((st.staff[a.role] || 0) >= role.max) return st;
      if (role.req === "cafe" && !st.upgrades.cafe) return st;
      if (role.req === "maxLevel" && !isMaxLevel(st)) return st;
      return { ...st, staff: { ...st.staff, [a.role]: (st.staff[a.role] || 0) + 1 } };
    }
    case "FIRE": return (st.staff[a.role] || 0) <= 0 ? st : { ...st, staff: { ...st.staff, [a.role]: st.staff[a.role] - 1 } };
    case "BUY_UPGRADE": {
      const u = UPGRADES[a.upgrade];
      if (!u) return st;
      const cur = st.upgrades[a.upgrade];
      if (a.tier2) {
        if (!cur || cur.tier === 2 || st.cash < u.tier2.cost) return st;
        return { ...st, cash: Math.round(st.cash - u.tier2.cost), upgrades: { ...st.upgrades, [a.upgrade]: { ...cur, tier: 2 } } };
      }
      if (cur) return st;
      if (st.cash < u.cost) return st;
      if (a.upgrade === "catResident") {
        return { ...st, cash: Math.round(st.cash - u.cost), upgrades: { ...st.upgrades, catResident: { variant: a.catColor || "orange", catName: a.catName || "Whiskers", catColor: a.catColor || "orange", tier: 1 } } };
      }
      return { ...st, cash: Math.round(st.cash - u.cost), upgrades: { ...st.upgrades, [a.upgrade]: { variant: a.variant || "default", tier: 1 } } };
    }
    case "BUY_EXPANSION": {
      const e = EXPANSIONS[a.expansion];
      if (!e || st.expansions[a.expansion] || st.cash < e.cost) return st;
      if (e.requires && !st.expansions[e.requires]) return st;
      const avail = LOCATIONS[st.location]?.layout?.expansions || [];
      if (!avail.includes(a.expansion)) return st;
      return { ...st, cash: Math.round(st.cash - e.cost), expansions: { ...st.expansions, [a.expansion]: true } };
    }
    case "SCHEDULE_EVENT": return st.cash < EVENTS[a.event].cost ? st : { ...st, scheduledEvents: [...st.scheduledEvents, a.event] };
    case "LIVE_SALE": {
      const g = a.genre;
      if (!st.inventory[g] || st.inventory[g].stock <= 0) return st;
      const price = st.inventory[g].price;
      const rm = getUpgradeStats(st).rm;
      const brm = getShelfBrowseBonus(st).revenueMult;
      const earned = Math.round(price * rm * brm);
      const tx = { id: Date.now() + Math.random(), type: "sale", genre: g, amount: earned, time: a.time };
      const newBs = { ...st.todaySales.booksSold };
      newBs[g] = (newBs[g] || 0) + 1;
      return {
        ...st, cash: st.cash + earned,
        inventory: { ...st.inventory, [g]: { ...st.inventory[g], stock: st.inventory[g].stock - 1 } },
        transactions: [...st.transactions.slice(-50), tx],
        todaySales: { ...st.todaySales, revenue: st.todaySales.revenue + earned, booksSold: newBs, customers: st.todaySales.customers },
      };
    }
    case "LIVE_BROWSE": {
      const tx = { id: Date.now() + Math.random(), type: "browse", time: a.time };
      return { ...st, transactions: [...st.transactions.slice(-50), tx], todaySales: { ...st.todaySales, customers: st.todaySales.customers + 1 } };
    }
    case "RESET_DAY_SALES": return { ...st, transactions: [], todaySales: { revenue: 0, booksSold: {}, customers: 0 } };
    case "ADVANCE_DAY_WITH_REPORT": {
      if (st.gameOver) return st;
      const r = a.report;
      const nc = st.cash;
      const finalCash = nc - r.costs;
      const nd = (st.dayOfWeek + 1) % 7;
      let newInv = { ...st.inventory };
      var shelverCost = 0;
      if (st.staff.shelvers > 0) {
        const restockQty = st.staff.shelvers * 8;
        const cap = getShelfCapacity(st);
        let curTotal = getTotalStock({ ...st, inventory: newInv });
        const gk = Object.keys(GENRES).sort((a2, b2) => GENRES[a2].cost - GENRES[b2].cost);
        let restocked = 0, rCost = 0;
        for (let i = 0; i < restockQty && curTotal < cap; i++) {
          const g = gk[i % gk.length];
          const cost = GENRES[g].cost;
          if (finalCash - rCost - cost >= 0) {
            newInv = { ...newInv, [g]: { ...newInv[g], stock: newInv[g].stock + 1 } };
            rCost += cost; curTotal++; restocked++;
          }
        }
        if (restocked > 0) r.notifications.push("📚 Shelvers restocked " + restocked + " books ($" + rCost + ")");
        shelverCost = rCost;
      }
      var managerCost = 0;
      if (st.staff.managers > 0) {
        const cap = getShelfCapacity(st);
        let curTotal = getTotalStock({ ...st, inventory: newInv });
        const gk = Object.keys(GENRES);
        const genreCount = gk.length;
        const targetPerGenre = Math.floor((cap - curTotal + Object.values(newInv).reduce((s, v) => s + v.stock, 0)) / genreCount);
        let bought = 0, mCost = 0;
        const budget = finalCash - shelverCost - 500;
        const sorted = [...gk].sort((a2, b2) => newInv[a2].stock - newInv[b2].stock);
        for (const g of sorted) {
          const need = Math.max(0, targetPerGenre - newInv[g].stock);
          for (let j = 0; j < need && curTotal < cap; j++) {
            const cost = GENRES[g].cost;
            if (mCost + cost > budget) break;
            newInv = { ...newInv, [g]: { ...newInv[g], stock: newInv[g].stock + 1 } };
            mCost += cost; curTotal++; bought++;
          }
        }
        if (bought > 0) r.notifications.push("👔 Manager purchased " + bought + " books ($" + mCost + ")");
        managerCost = mCost;
      }
      let newEvents = st.scheduledEvents.slice(1);
      let newScoutTimer = (st.scoutTimer || 0) + 1;
      if (st.staff.scouts > 0 && newScoutTimer >= 5) {
        newEvents = [...newEvents, "authorSigning"];
        r.notifications.push("🔎 Scout found a new author for a signing!");
        newScoutTimer = 0;
      }
      let editorBonus = 0;
      if (st.staff.editors > 0) {
        const totalSold = Object.values(r.booksSold).reduce((s, v) => s + v, 0);
        editorBonus = totalSold * 3 * st.staff.editors;
        if (editorBonus > 0) r.notifications.push("✏️ Exclusive editions earned +$" + editorBonus + " premium");
      }
      const adjustedCash = finalCash - (shelverCost || 0) - (managerCost || 0) + editorBonus;
      let newRareBooks = [...(st.rareBooks || [])];
      if (a.preRolledDrop) {
        const drop = a.preRolledDrop;
        const ownedIds = newRareBooks.map(b => b.id);
        if (!ownedIds.includes(drop.id)) {
          newRareBooks.push({ ...drop, dayFound: st.day + 1 });
          r.notifications.push(`📜 A customer donated a rare book: ${drop.name} (${drop.rarity})! Worth $${drop.value}!`);
        }
      }
      let newRegulars = [...(st.regulars || [])];
      const nextDay = st.day + 1;
      let regularRevenue = 0;
      newRegulars = newRegulars.map(reg => {
        const daysSince = nextDay - reg.lastVisit;
        if (daysSince < reg.visitFreq) return reg;
        const genre = reg.favGenre;
        const hasStock = newInv[genre] && newInv[genre].stock > 0;
        if (hasStock) {
          const price = newInv[genre].price;
          const brm = getShelfBrowseBonus(st).revenueMult;
          const earned = Math.round(price * getUpgradeStats(st).rm * brm);
          newInv = { ...newInv, [genre]: { ...newInv[genre], stock: newInv[genre].stock - 1 } };
          regularRevenue += earned;
          return { ...reg, loyalty: Math.min(100, reg.loyalty + ri(3, 8)), lastVisit: nextDay, visits: reg.visits + 1, totalSpent: reg.totalSpent + earned };
        } else {
          r.notifications.push(REG_DISAPPOINTED[nextDay % REG_DISAPPOINTED.length](reg.name, genre));
          return { ...reg, loyalty: Math.max(0, reg.loyalty - ri(8, 15)), lastVisit: nextDay, visits: reg.visits + 1 };
        }
      });
      const lost = newRegulars.filter(reg => reg.loyalty <= 0);
      if (lost.length > 0) lost.forEach(reg => r.notifications.push(`😢 ${reg.name} stopped coming.`));
      newRegulars = newRegulars.filter(reg => reg.loyalty > 0);
      if (newRegulars.length < 12 && st.reputation > 35) {
        const spawnChance = 0.08 + (st.reputation / 600);
        if (Math.random() < spawnChance) {
          const newReg = generateRegular(nextDay, newRegulars.length);
          if (!newRegulars.some(r2 => r2.name === newReg.name)) {
            newRegulars.push(newReg);
            r.notifications.push(`⭐ ${newReg.name} became a regular! Loves ${GENRES[newReg.favGenre]?.name || "books"}.`);
          }
        }
      }
      const loyalCount = newRegulars.filter(reg => reg.loyalty >= 60).length;
      if (regularRevenue > 0) r.notifications.push(`🤝 Regulars spent $${regularRevenue} today`);
      const finalAdjustedCash = adjustedCash + regularRevenue;
      return {
        ...st, cash: Math.round(finalAdjustedCash), day: st.day + 1,
        week: nd === 0 ? st.week + 1 : st.week, dayOfWeek: nd,
        inventory: newInv, dailyReport: r,
        todayEvent: newEvents.length > 0 ? null : (st.scheduledEvents[0] || null),
        scheduledEvents: newEvents,
        totalRevenue: st.totalRevenue + r.revenue + editorBonus + regularRevenue,
        totalExpenses: st.totalExpenses + r.costs + (shelverCost || 0) + (managerCost || 0),
        reputation: Math.min(100, Math.max(0, st.reputation + (r.repChange || 0) + loyalCount * 0.02)),

function useCustomerAnim(state, storeOpen) {
  const ref = useRef([]);
  const sz = getStoreSize(state);
  const liveCount = state.todaySales ? state.todaySales.customers : 0;
  const target = storeOpen ? Math.min(Math.max(3, Math.ceil(liveCount * 0.35)), sz.custMax) : 0;
  useEffect(() => {
    if (!storeOpen) { ref.current.length = 0; return; }
    const doorX = 110, doorY = 174;
    const spots = [{x:60,y:38},{x:75,y:52},{x:60,y:64},{x:135,y:38},{x:150,y:52},{x:135,y:64},{x:16,y:35},{x:16,y:75},{x:200,y:35},{x:200,y:75},{x:85,y:85},{x:95,y:95},{x:120,y:110},{x:70,y:130},{x:155,y:130}];
    const ctr = { x: 175, y: 24 };
    const tick = () => {
      const cs = ref.current;
      if (cs.length < target && Math.random() < 0.08) {
        const sd = Math.floor(Math.random()*10000);
        const sp = spots[Math.floor(Math.random()*spots.length)];
        cs.push({ x:doorX,y:doorY,seed:sd,targetX:sp.x+Math.random()*6-3,targetY:sp.y+Math.random()*6-3,state:"entering",timer:0,browseTime:120+Math.floor(Math.random()*200),speed:0.4+Math.random()*0.3,isChild:sd%6===0 });
      }
      for(let i=cs.length-1;i>=0;i--){
        const c=cs[i];if(!c){cs.splice(i,1);continue;}
        const ddx=c.targetX-c.x,ddy=c.targetY-c.y,d=Math.sqrt(ddx*ddx+ddy*ddy);
        if(isNaN(d)){cs.splice(i,1);continue;}
        if(d>1.5){c.x+=(ddx/d)*c.speed;c.y+=(ddy/d)*c.speed;}
        else switch(c.state){
          case "entering":c.state="browsing";c.timer=0;break;
          case "browsing":c.timer++;if(c.timer>c.browseTime){if(Math.random()<0.6){c.state="checkout";c.targetX=ctr.x+Math.random()*10-5;c.targetY=ctr.y+Math.random()*6;}else{c.state="leaving";c.targetX=doorX;c.targetY=doorY;}}else if(c.timer%80===0&&Math.random()<0.4){const ns=spots[Math.floor(Math.random()*spots.length)];c.targetX=ns.x+Math.random()*6-3;c.targetY=ns.y+Math.random()*6-3;}break;
          case "checkout":c.timer++;if(c.timer>c.browseTime+60){c.state="leaving";c.targetX=doorX;c.targetY=doorY;}break;
          case "leaving":if(d<3)cs.splice(i,1);break;
        }
      }
    };
    const iv=setInterval(tick,33);return()=>clearInterval(iv);
  },[target,storeOpen]);
  return ref;
}

function InventoryTab({ state, dispatch }) {

          <span style={{color:S.il}}>📚 Total Stock: <b>{total}</b> / {cap}</span>

              <span style={{fontSize:12,color:S.il,width:65}}>Price: ${inv.price}</span>

              <Btn small variant="secondary" onClick={()=>dispatch({type:"SET_PRICE",genre:k,price:inv.price+1})}>+$1</Btn>

function StaffTab({ state, dispatch }) {

              <button key={vid} onClick={()=>{dispatch({type:"BUY_UPGRADE",upgrade:picking,variant:vid});setPicking(null);}}

                <div style={{display:"flex",gap:3,marginBottom:6}}>

                  ))}
                </div>
                <div style={{fontSize:13,fontWeight:700}}>{v.name}</div>
              </button>
            ))}
          </div>

          return (
            <div key={k} style={{background:owned?S.pa:S.cd,border:`1px solid ${owned?S.ac:S.bd}`,borderRadius:8,padding:12}}>
              <div style={{fontSize:22}}>{u.emoji}</div>
              <div style={{fontSize:13,fontWeight:700,marginTop:4}}>{t===2?u.tier2.name:u.name}</div>
              <div style={{fontSize:11,color:S.il,marginBottom:6}}>{t===2?u.tier2.desc:u.desc}</div>
              {!owned ? (
                k==="catResident" ? <Btn small disabled={state.cash<u.cost} onClick={()=>setPicking("catResident")}>Adopt · ${u.cost}</Btn>
                : u.variants ? <Btn small disabled={state.cash<u.cost} onClick={()=>setPicking(k)}>Choose · ${u.cost}</Btn>

                  <span style={{fontSize:11,color:S.ad,fontWeight:700}}>✓ Installed</span>
                  <div style={{marginTop:4}}><Btn small variant="gold" disabled={state.cash<u.tier2.cost} onClick={()=>dispatch({type:"BUY_UPGRADE",upgrade:k,tier2:true})}>⬆ ${u.tier2.cost}</Btn></div>

            </div>
          );
        })}
      </div>
    </div>
  );
}

              <span style={{fontSize:9,fontWeight:700,color:RARITY_COLORS[b.rarity],background:RARITY_COLORS[b.rarity]+"18",padding:"1px 6px",borderRadius:8}}>{b.rarity}</span>

          </div>

      ))}

  );
}

  return (

          <input type="range" min={5} max={14} value={open} style={{width:"100%"}} onChange={e=>dispatch({type:"SET_HOURS",hours:{open:Number(e.target.value),close:Math.max(Number(e.target.value)+1,close)}})} />

      <div style={{fontSize:16,fontWeight:700,fontFamily:S.fd,marginBottom:4,marginTop:20}}>💾 Save Game</div>
      <div style={{background:S.cd,border:`1px solid ${S.bd}`,borderRadius:8,padding:14}}>

        <div style={{display:"flex",gap:8}}>

}

}

function BookstoreGame() {

  const [lid, setLid] = useState(null);
  const [gk, setGk] = useState(0);
  const [storeName, setStoreName] = useState("Paper Dreams");
  const [savedGame, setSavedGame] = useState(null);

  useEffect(() => {
    (async () => {
      try { const raw = await store.get(SAVE_KEY); if (raw) setSavedGame(JSON.parse(raw)); } catch(e) {}
      setLoadingDone(true);
    })();
  }, []);

  if (!loadingDone) return (
    <div style={{fontFamily:S.fb,background:S.bg,color:S.ink,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center"}}><div style={{fontSize:48,marginBottom:8}}>📚</div><div style={{fontSize:14,color:S.il}}>Loading...</div></div>
    </div>
  );

  if (screen === "title") {
    const q = rq();
    return (
      <div style={{fontFamily:S.fb,background:S.bg,color:S.ink,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20,textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:8}}>📚</div>
        <h1 style={{fontFamily:S.fd,fontSize:32,fontWeight:900,marginBottom:4}}>Paper Dreams</h1>
        <p style={{color:S.il,fontSize:14,fontStyle:"italic",maxWidth:340,marginBottom:28,lineHeight:1.5}}>A cozy business management game about running your own little bookstore.</p>
        <div style={{display:"flex",flexDirection:"column",gap:10,alignItems:"center"}}>
          {savedGame && (
            <button onClick={()=>{setLid(savedGame.location);setStoreName(savedGame.storeName||"Paper Dreams");setScreen("game-load");setGk(k=>k+1);}}
              style={{padding:"12px 36px",background:"#27ae60",color:"#fff",border:"none",borderRadius:8,fontFamily:S.fd,fontSize:16,fontWeight:700,cursor:"pointer",width:220}}>
              Continue · Day {savedGame.day}
            </button>
          )}
          <button onClick={()=>setScreen("select")} style={{padding:"12px 36px",background:savedGame?S.cd:S.ac,color:savedGame?S.ink:"#fff",border:savedGame?`1px solid ${S.bd}`:"none",borderRadius:8,fontFamily:S.fd,fontSize:16,fontWeight:700,cursor:"pointer",width:220}}>New Game</button>
          {savedGame && (
            <div style={{marginTop:8}}>
              <div style={{fontSize:12,color:S.il}}>{savedGame.storeName} · ${(savedGame.cash||0).toLocaleString()}</div>
              <button onClick={async()=>{await store.del(SAVE_KEY);setSavedGame(null);}} style={{background:"none",border:"none",color:"#c0392b",fontSize:11,cursor:"pointer",textDecoration:"underline",marginTop:4}}>Delete save</button>
            </div>
          )}
        </div>
        <div style={{marginTop:32,fontSize:12,color:S.il,fontStyle:"italic",maxWidth:280}}>"{q.t}" — {q.a}</div>
      </div>
    );
  }

  if (screen === "select") {
    return (
      <div style={{fontFamily:S.fb,background:S.bg,color:S.ink,minHeight:"100vh",padding:20}}>
        <button onClick={()=>setScreen("title")} style={{background:"none",border:"none",color:S.il,cursor:"pointer",fontSize:13,marginBottom:12}}>← Back</button>
        <h2 style={{fontFamily:S.fd,fontSize:22,fontWeight:700,marginBottom:16}}>Choose Your Location</h2>
        {Object.entries(LOCATIONS).map(([id,loc])=>{
          const dc={Easiest:"#27ae60",Easy:"#2ecc71",Hard:"#e67e22",Hardest:"#c0392b"};
          return (
            <button key={id} onClick={()=>{setLid(id);setScreen("name");}}
              style={{display:"block",width:"100%",maxWidth:450,background:S.cd,border:`2px solid ${S.bd}`,borderRadius:10,padding:16,textAlign:"left",cursor:"pointer",fontFamily:S.fb,marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between"}}>
                <span style={{fontSize:16,fontWeight:700,fontFamily:S.fd}}>{loc.icon} {loc.name}</span>
                <span style={{fontSize:11,fontWeight:700,color:dc[loc.difficulty],background:dc[loc.difficulty]+"18",padding:"2px 8px",borderRadius:20}}>{loc.difficulty}</span>
              </div>
              <div style={{fontSize:12,color:S.il,marginTop:4}}>{loc.desc}</div>
              <div style={{fontSize:11,color:S.il,marginTop:6}}>Cash: ${loc.startingCash.toLocaleString()} · Rent: ${loc.monthlyRent}/mo</div>
            </button>
          );
        })}

  if (screen === "name") {
    return (
      <div style={{fontFamily:S.fb,background:S.bg,color:S.ink,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20,textAlign:"center"}}>
        <div style={{fontSize:48,marginBottom:12}}>📚</div>
        <h2 style={{fontFamily:S.fd,fontSize:24,fontWeight:700,marginBottom:8}}>Name Your Bookstore</h2>
        <input type="text" value={storeName} maxLength={30} onChange={e=>setStoreName(e.target.value)}
          style={{fontFamily:S.fd,fontSize:20,fontWeight:700,textAlign:"center",padding:"12px 20px",border:`2px solid ${S.bd}`,borderRadius:10,background:S.cd,color:S.ink,width:300,maxWidth:"90%",outline:"none"}} />
        <div style={{marginTop:20,display:"flex",gap:10}}>
          <button onClick={()=>setScreen("select")} style={{padding:"10px 20px",background:S.cd,color:S.il,border:`1px solid ${S.bd}`,borderRadius:8,cursor:"pointer"}}>← Back</button>
          <button onClick={()=>{setGk(k=>k+1);setScreen("game");}} disabled={!storeName.trim()}
            style={{padding:"10px 28px",background:storeName.trim()?S.ac:S.bd,color:storeName.trim()?"#fff":S.il,border:"none",borderRadius:8,fontFamily:S.fd,fontSize:16,fontWeight:700,cursor:storeName.trim()?"pointer":"not-allowed"}}>
            Open for Business →
          </button>

  if (screen === "game-load" && savedGame) return <GameScreen key={`load-${gk}`} locationId={savedGame.location} storeName={savedGame.storeName} savedState={savedGame} onBack={()=>setScreen("title")} onSaveUpdate={setSavedGame} />;
  return <GameScreen key={`${lid}-${gk}`} locationId={lid} storeName={storeName} onBack={()=>setScreen("select")} onSaveUpdate={setSavedGame} />;
}

function GameScreen({ locationId, storeName: initialName, savedState, onBack, onSaveUpdate }) {
  const [state, dispatch] = useReducer(gameReducer, locationId, (lid) => savedState || initGameState(lid));
  const [tab, setTab] = useState("dashboard");

  useEffect(() => { if (!savedState && initialName && initialName !== state.storeName) dispatch({type:"SET_NAME",name:initialName}); }, []);

  const prevDay = useRef(state.day);
  useEffect(() => {
    if (state.day !== prevDay.current) {
      prevDay.current = state.day;
      const saveData = {...state,transactions:[],todaySales:{revenue:0,booksSold:{},customers:0}};
      (async()=>{try{await store.set(SAVE_KEY,JSON.stringify(saveData));if(onSaveUpdate)onSaveUpdate(saveData);}catch(e){}})();
    }
  }, [state.day]);

  const [phase, setPhase] = useState("planning");
  const [timeLeft, setTimeLeft] = useState(DAY_DURATION);
  const [reportData, setReportData] = useState(null);
  const [speed, setSpeed] = useState(1);
  const timerRef = useRef(null);
  const salesRef = useRef(null);
  const stateRef = useRef(state);
  stateRef.current = state;

  const expectedCustomers = useMemo(() => {
    const l = LOCATIONS[state.location];
    const sz = getStoreSize(state);
    const us = getUpgradeStats(state);
    let tb = Math.round((l.dailyTrafficBase[0]+l.dailyTrafficBase[1])/2);
    tb = Math.round(tb*((state.storeHours.close-state.storeHours.open)/9));
    if(state.dayOfWeek>=5)tb=Math.round(tb*1.3);
    let eventMult=1.0;
    if(state.todayEvent&&EVENTS[state.todayEvent])eventMult=1+(EVENTS[state.todayEvent].trafficPct||0);
    const rp=0.5+(state.reputation/100);
    const ob=state.staff.shelvers>0?1+state.staff.shelvers*0.05:0.95;
    const promoMult=1+(state.staff.promoters||0)*0.25;
    return Math.max(1,Math.round(tb*eventMult*us.tm*sz.trafficMult*rp*ob*promoMult));
  }, [state.day,state.location,state.reputation,state.staff,state.storeHours,state.todayEvent,state.upgrades,state.expansions]);

  const openStore = () => {
    dispatch({type:"RESET_DAY_SALES"});
    setPhase("open"); setTimeLeft(DAY_DURATION); setTab("dashboard"); setSpeed(1);
  };

  useEffect(() => {
    if (phase !== "open") { if(salesRef.current)clearInterval(salesRef.current); return; }
    const saleInterval = Math.max(50,Math.floor((DAY_DURATION*1000)/(expectedCustomers*1.2)/speed));
    salesRef.current = setInterval(() => {
      const s = stateRef.current;
      if (s.staff.cashiers === 0) return;
      const l = LOCATIONS[s.location];
      const gk = Object.keys(GENRES);
      const liveBrowse = getShelfBrowseBonus(s);
      if (Math.random() < 0.35 + liveBrowse.buyChanceMod) {
        const g = gk[Math.floor(Math.random()*gk.length)];
        let gm = l.genreBonus[g] || 1;
        if (Math.random() < gm * 0.5 && s.inventory[g] && s.inventory[g].stock > 0) {
          dispatch({type:"LIVE_SALE",genre:g,time:""});
        } else dispatch({type:"LIVE_BROWSE",time:""});
      } else dispatch({type:"LIVE_BROWSE",time:""});
    }, saleInterval);
    return () => { if(salesRef.current)clearInterval(salesRef.current); };
  }, [phase, expectedCustomers, speed]);

  useEffect(() => {
    if (phase !== "open") return;
    const tickMs = Math.max(50,Math.floor(1000/speed));
    const iv = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          clearInterval(iv);
          if(salesRef.current)clearInterval(salesRef.current);
          const s = stateRef.current;
          const l = LOCATIONS[s.location];
          const sz = getStoreSize(s);
          const totalRent = (l.monthlyRent+sz.extraRent)/30;
          const sc = getStaffCost(s.staff);
          const ec = s.todayEvent?EVENTS[s.todayEvent].cost:0;
          const costs = Math.round(totalRent+sc+ec);
          const revenue = s.todaySales.revenue;
          const nts = [];
          const gk2 = Object.keys(GENRES);
          const os = gk2.filter(g=>s.inventory[g].stock===0);
          if(os.length>0)nts.push("Out of stock: "+os.map(g=>GENRES[g].name).join(", ")+"!");
          let rc=0;
          const totalBooks=Object.values(s.todaySales.booksSold).reduce((a,b)=>a+b,0);
          if(totalBooks>15)rc+=0.2;else if(totalBooks>8)rc+=0.1;
          if(os.length>3)rc-=1.5;else if(os.length>1)rc-=0.8;else if(os.length===1)rc-=0.3;
          const comments = generateGuestComments(s, ri(3,6));
          setReportData({customers:s.todaySales.customers,revenue,costs,profit:revenue-costs,booksSold:s.todaySales.booksSold,notifications:nts,repChange:rc,comments});
          setPhase("report");
          return 0;
        }
        return prev-1;
      });
    }, tickMs);
    return () => clearInterval(iv);
  }, [phase, speed]);

  const closeReport = () => {
    if (reportData) {
      const s = stateRef.current;
      const curEv = s.todayEvent&&EVENTS[s.todayEvent]?EVENTS[s.todayEvent]:null;
      const rareDropMult = curEv?(curEv.rareDropMult||1.0):1.0;
      const dropChance = (0.10+(s.reputation/500)+(getUpgradeStats(s).coz/800))*rareDropMult;
      const ownedIds = (s.rareBooks||[]).map(b=>b.id);
      let drop = null;
      if(Math.random()<dropChance) drop = rollRareBook(ownedIds);
      dispatch({type:"ADVANCE_DAY_WITH_REPORT",report:reportData,preRolledDrop:drop});
    }
    setReportData(null); setPhase("planning"); setTimeLeft(DAY_DURATION);
  };

  const tabs = [
    {id:"dashboard",l:"📋 Home"},{id:"inventory",l:"📦 Books"},{id:"staff",l:"👥 Staff"},
    {id:"design",l:"🏠 Improve"},{id:"expand",l:"🏗️ Expand"},
    {id:"events",l:"🎉 Events"},{id:"collection",l:"📜 Rare"},{id:"hours",l:"🕐 Hours"},
  ];

  return (
    <div style={{fontFamily:S.fb,background:S.bg,color:S.ink,minHeight:"100vh",maxWidth:520,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",borderBottom:`1px solid ${S.bd}`,background:S.cd,position:"sticky",top:0,zIndex:10}}>
        <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:S.il,fontSize:12}}>← Back</button>
        <span style={{fontFamily:S.fd,fontWeight:700,fontSize:15}}>📚 {state.storeName}</span>
        <span style={{fontSize:13,fontWeight:700,color:state.cash<500?"#c0392b":S.ad}}>${state.cash.toLocaleString()}</span>
      </div>
      {phase === "open" && (
        <div style={{background:"#3e2723",padding:"6px 12px",display:"flex",alignItems:"center",gap:8}}>
          <div style={{flex:1,height:8,background:"rgba(255,255,255,0.15)",borderRadius:4,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${(timeLeft/DAY_DURATION)*100}%`,background:timeLeft<20?"#e74c3c":timeLeft<60?"#f39c12":"#27ae60",borderRadius:4}} />
          </div>
          <span style={{color:"#fff",fontSize:13,fontWeight:700,fontFamily:S.fd,minWidth:40,textAlign:"right"}}>{Math.floor(timeLeft/60)}:{(timeLeft%60).toString().padStart(2,"0")}</span>
          <div style={{display:"flex",gap:3}}>
            {[1,2,5,10].map(s=>(
              <button key={s} onClick={()=>setSpeed(s)} style={{padding:"2px 6px",fontSize:10,fontWeight:700,borderRadius:4,border:"none",cursor:"pointer",background:speed===s?"#f39c12":"rgba(255,255,255,0.15)",color:speed===s?"#3e2723":"rgba(255,255,255,0.6)"}}>{s}x</button>
            ))}
          </div>
        </div>
      )}
      <div style={{display:"flex",gap:2,padding:"6px 8px",overflowX:"auto",borderBottom:`1px solid ${S.bd}`,background:S.pa,position:"sticky",top:phase==="open"?71:41,zIndex:10}}>
        {tabs.map(t=><TabBtn key={t.id} active={tab===t.id} onClick={()=>setTab(t.id)}>{t.l}</TabBtn>)}
      </div>
      {phase === "report" && reportData && <EndOfDayReport state={state} report={reportData} onClose={closeReport} />}
      {phase !== "report" && (
        <div style={{paddingBottom:40}}>
          {tab==="dashboard"&&<DashboardTab state={state} dispatch={dispatch} phase={phase} onOpenStore={openStore} timeLeft={timeLeft} />}
          {tab==="inventory"&&<InventoryTab state={state} dispatch={dispatch} />}
          {tab==="staff"&&<StaffTab state={state} dispatch={dispatch} />}
          {tab==="design"&&<DesignTab state={state} dispatch={dispatch} />}
          {tab==="expand"&&<ExpansionTab state={state} dispatch={dispatch} />}
          {tab==="events"&&<EventsTab state={state} dispatch={dispatch} />}
          {tab==="collection"&&<CollectionTab state={state} />}
          {tab==="hours"&&<HoursTab state={state} dispatch={dispatch} />}
        </div>
      )}
    </div>
  );
}
